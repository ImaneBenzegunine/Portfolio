name: imane-portfolio
services:
  frontend:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://imanebenzegunine.com}
        PUBLIC_EMAIL: ${PUBLIC_EMAIL:-}
        CV_AVAILABLE: ${CV_AVAILABLE:-false}
    ports:
      - "127.0.0.1:${HOST_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }
  backend:
    build: ./backend
    environment:
      CONTACT_MODE: ${CONTACT_MODE:-local}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:-local-only-change-before-publishing}
      DB_PATH: /data/contact.sqlite
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
    volumes:
      - contact_data:/data
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }
volumes:
  contact_data:
networks:
  app:
