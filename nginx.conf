server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location = /health { return 200 'ok'; }
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $contact_backend http://backend:3001;
    proxy_pass $contact_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location ~ /\. { return 404; }
  location ~ ^/(data|backend|node_modules|backups)/ { return 404; }
  location ~* \.(sqlite|db|env|mjs|ts|tsx|map)$ { return 404; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location /cv/ { try_files $uri $uri/index.html =404; }
  location / { try_files $uri $uri/index.html $uri/ =404; }
  error_page 404 /404/index.html;
  location = /404/index.html { internal; }
}
